  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

;margin:0;}\n  ::placeholder{color:#9aabb2;}\n  *:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;}\n\n  .wrap{max-width:760px;margin:0 auto;padding:0 24px;}\n  .rule{width:28px;height:2px;background:linear-gradient(90deg,var(--cyan),var(--navy));}\n\n  /* sticky bar */\n  .bar{position:sticky;top:0;z-index:20;background:rgba(250,250,250,.86);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);}\n  .bar-in{max-width:760px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;gap:16px;}\n  .logo{display:flex;align-items:center;gap:10px;flex:0 0 auto;}\n  .mark{width:28px;height:28px;border-radius:50%;padding:2px;background:linear-gradient(90deg,var(--cyan),var(--navy));}\n  .mark i{display:flex;width:100%;height:100%;border-radius:50%;background:var(--gris);align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:13px;font-style:normal;color:var(--azul);}\n  .word{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px;letter-spacing:.3px;color:var(--azul);white-space:nowrap;}\n  .track{flex:1;min-width:0;height:4px;border-radius:999px;background:var(--line);overflow:hidden;}\n  .track span{display:block;height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,var(--cyan),var(--navy));transition:width 300ms var(--ease);}\n  .mono{font-family:'DM Mono',monospace;letter-spacing:1.5px;text-transform:uppercase;}\n  .pct{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:1.5px;color:var(--spa);flex:0 0 auto;}\n\n  /* hero */\n  .hero{background:var(--azul);position:relative;overflow:hidden;}\n  .hero .blob{position:absolute;top:-180px;right:-120px;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,rgba(13,224,230,.10) 0%,rgba(13,224,230,0) 70%);pointer-events:none;}\n  .hero-in{max-width:760px;margin:0 auto;padding:88px 24px 72px;position:relative;}\n  .eyebrow{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.4);}\n  .hero h1{font-size:46px;line-height:1.1;font-weight:700;color:#fff;margin:22px 0 24px;max-width:15ch;text-wrap:pretty;}\n  .hero p{font-size:18px;line-height:1.8;color:rgba(255,255,255,.8);margin:0;max-width:52ch;text-wrap:pretty;}\n\n  /* cards */\n  .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:28px;}\n  .card.light{background:var(--gris);}\n  .q{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:17px;line-height:1.5;color:var(--ink);margin-bottom:20px;text-wrap:pretty;}\n  .q .tag{display:block;font-family:'DM Mono',monospace;font-size:10px;letter-spacing:1.5px;color:var(--spa);margin-bottom:8px;}\n  .stack{display:flex;flex-direction:column;gap:20px;}\n  section{margin-bottom:64px;}\n  .sec-k{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--spa);margin:16px 0 10px;}\n  section h2{font-size:26px;font-weight:700;color:var(--azul);margin-bottom:12px;}\n  .sec-p{font-size:16px;line-height:1.8;color:var(--spa);margin:0 0 28px;max-width:56ch;}\n\n  /* fields */\n  label.f{display:block;font-family:'Space Grotesk',sans-serif;font-size:12px;font-weight:500;color:var(--ink);margin-bottom:4px;}\n  input[type=text],select,textarea{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:8px;background:#fff;font-family:Quicksand,sans-serif;font-size:14px;line-height:1.7;color:var(--ink);outline:none;transition:border-color 150ms,box-shadow 150ms;}\n  select{height:44px;padding:0 13px;font-size:13px;cursor:pointer;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--spa) 50%),linear-gradient(135deg,var(--spa) 50%,transparent 50%);background-position:calc(100% - 18px) 19px,calc(100% - 13px) 19px;background-size:5px 5px,5px 5px;background-repeat:no-repeat;}\n  textarea{resize:vertical;}\n  input:focus,select:focus,textarea:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(13,224,230,.10);}\n  .invalid{border-color:#c94f4f !important;}\n  .grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;}\n\n  /* scale + choices */\n  .scale{display:flex;flex-wrap:wrap;gap:8px;}\n  .scale button{min-width:44px;min-height:44px;padding:0 12px;border:1.5px solid var(--line);border-radius:8px;background:#fff;color:var(--spa);font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:600;cursor:pointer;transition:all 150ms var(--ease);}\n  .scale button:hover{border-color:var(--azul);}\n  .scale button[aria-pressed=true]{background:var(--azul);border-color:var(--azul);color:#fff;}\n  .ends{display:flex;justify-content:space-between;gap:12px;margin-top:12px;font-family:'DM Mono',monospace;font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--spa);}\n  .choices{display:flex;gap:10px;flex-wrap:wrap;}\n  .choices button{min-height:44px;padding:0 22px;border-radius:8px;border:1.5px solid var(--azul);background:#fff;color:var(--azul);font-family:'Space Grotesk',sans-serif;font-size:14px;font-weight:600;cursor:pointer;transition:all 150ms var(--ease);}\n  .choices button:hover{opacity:.88;transform:translateY(-1px);}\n  .choices button[aria-pressed=true]{background:var(--azul);color:#fff;}\n  .more{margin-top:22px;padding-top:22px;border-top:1px solid var(--line);animation:reveal 300ms var(--ease);}\n  [hidden]{display:none !important;}\n  @keyframes reveal{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:none;}}\n  @keyframes pop{from{opacity:0;transform:scale(.96);}to{opacity:1;transform:none;}}\n\n  /* intro + submit */\n  .intro{margin-top:-32px;position:relative;display:flex;gap:18px;align-items:flex-start;padding:26px 28px;}\n  .check{flex:0 0 auto;width:34px;height:34px;border-radius:50%;border:1.5px solid var(--cyan);display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-size:15px;color:var(--azul);}\n  .intro strong{display:block;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:17px;color:var(--azul);margin-bottom:8px;}\n  .intro p{margin:0;font-size:15px;line-height:1.8;color:var(--spa);text-wrap:pretty;}\n  #err{background:#fff;border:1.5px solid #c94f4f;border-radius:12px;padding:20px 24px;margin-bottom:20px;font-size:15px;line-height:1.7;color:#8f2525;animation:reveal 300ms var(--ease);}\n  .send{display:flex;justify-content:center;}\n  .send button{min-height:52px;padding:0 40px;border:none;border-radius:8px;background:var(--azul);color:#fff;font-family:'Space Grotesk',sans-serif;font-size:18px;font-weight:700;cursor:pointer;transition:opacity 150ms,transform 150ms var(--ease);}\n  .send button:hover{opacity:.88;transform:translateY(-1px);}\n  .send button:disabled{opacity:.6;cursor:wait;transform:none;}\n  .note{text-align:center;margin-top:18px;font-size:13px;line-height:1.8;color:var(--spa);}\n\n  /* footer + thanks */\n  footer{background:var(--azul);padding:44px 24px;}\n  .foot{max-width:760px;margin:0 auto;display:flex;flex-wrap:wrap;gap:20px;align-items:center;justify-content:space-between;}\n  .foot .mk{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--cyan);display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14px;color:#fff;}\n  .foot .w{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:16px;letter-spacing:.4px;color:#fff;white-space:nowrap;}\n  .foot .t{font-size:12px;color:rgba(255,255,255,.4);}\n  .foot .links{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:rgba(255,255,255,.8);}\n  .foot .links a{color:rgba(255,255,255,.8);}\n  #thanks{position:fixed;inset:0;z-index:50;background:var(--azul);display:flex;align-items:center;justify-content:center;padding:32px;animation:pop 500ms var(--ease);}\n  #thanks .in{max-width:520px;text-align:center;}\n  #thanks .ring{width:56px;height:56px;margin:0 auto 28px;border-radius:50%;border:2px solid var(--cyan);display:flex;align-items:center;justify-content:center;font-size:24px;color:#fff;}\n  #thanks h2{font-size:36px;line-height:1.2;font-weight:700;color:#fff;margin:18px 0 20px;}\n  #thanks p{font-size:17px;line-height:1.8;color:rgba(255,255,255,.8);margin:0;text-wrap:pretty;}\n\n  @media (max-width:600px){\n    .hero h1{font-size:34px;}\n    .hero-in{padding:64px 24px 56px;}\n    .card{padding:22px;}\n  }\n  @media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important;}}\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n\n\n<div class=\"bar\">\n  <div class=\"bar-in\">\n    <div class=\"logo\"><div class=\"mark\"><i>M<\u002Fi><\u002Fdiv><span class=\"word\">MENTO.IA<\u002Fspan><\u002Fdiv>\n    <div class=\"track\"><span id=\"progress\"><\u002Fspan><\u002Fdiv>\n    <span class=\"pct\" id=\"pct\">0%<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"hero\">\n  <div class=\"blob\"><\u002Fdiv>\n  <div class=\"hero-in\">\n    <div class=\"rule\"><\u002Fdiv>\n    <div class=\"eyebrow\" style=\"margin-top:20px;\">TU OPINIÓN · CONFIDENCIAL<\u002Fdiv>\n    <h1>Contanos cómo te fue con Mento.IA<\u002Fh1>\n    <p>Terminaste tu recorrido y ahora nos toca a nosotros escuchar. Tus respuestas definen qué mejoramos, qué agregamos y cómo acompañamos a quienes vienen después.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"wrap\">\n\n  <div class=\"card intro\">\n    <div class=\"check\">✓<\u002Fdiv>\n    <div>\n      <strong>Es confidencial, y tu sinceridad es lo más valioso que podés darnos.<\u002Fstrong>\n      <p>Nadie de tu colegio ve tus respuestas individuales: las leemos solo dentro del equipo de Mento.IA y las usamos para mejorar la plataforma. No hay respuestas correctas ni incorrectas, así que decinos las cosas como son. Te va a llevar unos 6 minutos.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"height:64px;\"><\u002Fdiv>\n\n  <section>\n    <div class=\"rule\"><\u002Fdiv>\n    <div class=\"sec-k\">01 · TU CONTEXTO<\u002Fdiv>\n    <h2>Dónde estudiás<\u002Fh2>\n    <div class=\"card\">\n      <div class=\"stack\">\n        <div>\n          <label class=\"f\" for=\"colegio\">Colegio<\u002Flabel>\n          <input type=\"text\" id=\"colegio\" data-field=\"colegio\" placeholder=\"Nombre completo de tu colegio\">\n        <\u002Fdiv>\n        <div>\n          <label class=\"f\" for=\"pais\">País<\u002Flabel>\n          <select id=\"pais\" data-field=\"pais\">\n            <option value=\"\">Elegí tu país<\u002Foption>\n            <option>Argentina<\u002Foption><option>Bolivia<\u002Foption><option>Chile<\u002Foption><option>Colombia<\u002Foption>\n            <option>Costa Rica<\u002Foption><option>Ecuador<\u002Foption><option>El Salvador<\u002Foption><option>España<\u002Foption>\n            <option>Guatemala<\u002Foption><option>Honduras<\u002Foption><option>México<\u002Foption><option>Nicaragua<\u002Foption>\n            <option>Panamá<\u002Foption><option>Paraguay<\u002Foption><option>Perú<\u002Foption><option>República Dominicana<\u002Foption>\n            <option>Uruguay<\u002Foption><option>Otro<\u002Foption>\n          <\u002Fselect>\n        <\u002Fdiv>\n        <div class=\"grid3\">\n          <div><label class=\"f\" for=\"anio\">Año<\u002Flabel><input type=\"text\" id=\"anio\" data-field=\"anio\" placeholder=\"ej. 5°\"><\u002Fdiv>\n          <div><label class=\"f\" for=\"division\">División<\u002Flabel><input type=\"text\" id=\"division\" data-field=\"division\" placeholder=\"ej. B\"><\u002Fdiv>\n          <div><label class=\"f\" for=\"curso\">Curso u orientación<\u002Flabel><input type=\"text\" id=\"curso\" data-field=\"curso\" placeholder=\"ej. Economía\"><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section>\n    <div class=\"rule\"><\u002Fdiv>\n    <div class=\"sec-k\">02 · EXPERIENCIA DE USO<\u002Fdiv>\n    <h2>Cómo se sintió usarla<\u002Fh2>\n    <p class=\"sec-p\">Pensá en el recorrido completo: entrar, navegar, responder y llegar al final.<\u002Fp>\n    <div class=\"stack\">\n\n      <div class=\"card\">\n        <div class=\"q\">¿Con qué facilidad pudiste usar la plataforma Mento.IA?<\u002Fdiv>\n        <div class=\"scale\" data-scale=\"facilidad\"><\u002Fdiv>\n        <div class=\"ends\"><span>ME COSTÓ MUCHO<\u002Fspan><span>FUE MUY FÁCIL<\u002Fspan><\u002Fdiv>\n        <div class=\"more\" id=\"more-facilidad\" hidden=\"\">\n          <label class=\"f\" for=\"facilidadDetalle\">Contanos un poco más: ¿qué parte te resultó difícil?<\u002Flabel>\n          <textarea rows=\"3\" id=\"facilidadDetalle\" data-field=\"facilidadDetalle\" placeholder=\"Lo que sea, aunque parezca un detalle\"><\u002Ftextarea>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"card\">\n        <div class=\"q\">¿Tuviste problemas técnicos mientras la usabas?<\u002Fdiv>\n        <div class=\"choices\" data-choice=\"problemas\"><\u002Fdiv>\n        <div class=\"more\" id=\"more-problemas\" hidden=\"\">\n          <label class=\"f\" for=\"problemasCuales\">¿Cuáles? Cuanto más concreto, mejor lo podemos arreglar.<\u002Flabel>\n          <textarea rows=\"3\" id=\"problemasCuales\" data-field=\"problemasCuales\" placeholder=\"Ej. se cortó al guardar, no cargaban los videos…\"><\u002Ftextarea>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"card\">\n        <div class=\"q\"><span class=\"tag\">ANTES<\u002Fspan>Antes de usar Mento.IA, ¿qué tan claro tenías qué estudiar al terminar el secundario?<\u002Fdiv>\n        <div class=\"scale\" data-scale=\"claridadAntes\"><\u002Fdiv>\n        <div class=\"ends\"><span>NO TENÍA IDEA<\u002Fspan><span>LO TENÍA DECIDIDO<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"card\">\n        <div class=\"q\"><span class=\"tag\">DESPUÉS<\u002Fspan>Y ahora, después de usarla, ¿cómo describirías esa claridad?<\u002Fdiv>\n        <div class=\"scale\" data-scale=\"claridadDespues\"><\u002Fdiv>\n        <div class=\"ends\"><span>SIGO IGUAL<\u002Fspan><span>MUCHO MÁS CLARO<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section>\n    <div class=\"rule\"><\u002Fdiv>\n    <div class=\"sec-k\">03 · CONTENIDO<\u002Fdiv>\n    <h2>Lo que leíste, viste y respondiste<\u002Fh2>\n    <p class=\"sec-p\">Las actividades, los videos, las preguntas y el reporte final.<\u002Fp>\n    <div class=\"stack\">\n\n      <div class=\"card\">\n        <div class=\"q\">La información sobre carreras y profesiones me resultó útil.<\u002Fdiv>\n        <div class=\"scale\" data-scale=\"utilidad\"><\u002Fdiv>\n        <div class=\"ends\"><span>PARA NADA<\u002Fspan><span>MUCHÍSIMO<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"card\">\n        <div class=\"q\">Las actividades me ayudaron a pensar en mis intereses.<\u002Fdiv>\n        <div class=\"scale\" data-scale=\"actividades\"><\u002Fdiv>\n        <div class=\"ends\"><span>PARA NADA<\u002Fspan><span>MUCHÍSIMO<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"card\">\n        <div class=\"q\">Siento que conozco mejor mis fortalezas e intereses que antes.<\u002Fdiv>\n        <div class=\"scale\" data-scale=\"fortalezas\"><\u002Fdiv>\n        <div class=\"ends\"><span>NO CAMBIÓ NADA<\u002Fspan><span>MUCHO MEJOR<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"card\">\n        <div class=\"q\"><span class=\"tag\">VIDEOS<\u002Fspan><label class=\"q\" style=\"margin:0;font-weight:600;\" for=\"videos\">¿Qué te parecieron los videos? Calidad, duración, contenido: contanos.<\u002Flabel><\u002Fdiv>\n        <textarea rows=\"3\" id=\"videos\" data-field=\"videos\" placeholder=\"Lo que te gustó y lo que no\"><\u002Ftextarea>\n      <\u002Fdiv>\n\n      <div class=\"card\">\n        <div class=\"q\"><span class=\"tag\">PREGUNTAS Y RESPUESTAS<\u002Fspan><label class=\"q\" style=\"margin:0;font-weight:600;\" for=\"preguntas\">¿Las preguntas eran claras? ¿Sentiste que se repetían?<\u002Flabel><\u002Fdiv>\n        <textarea rows=\"3\" id=\"preguntas\" data-field=\"preguntas\" placeholder=\"Si alguna te confundió, decinos cuál\"><\u002Ftextarea>\n      <\u002Fdiv>\n\n      <div class=\"card\">\n        <div class=\"q\"><span class=\"tag\">REPORTE FINAL<\u002Fspan><label class=\"q\" style=\"margin:0;font-weight:600;\" for=\"reporte\">¿Te sentiste reflejado en el reporte? ¿Fue fácil de leer? ¿Qué le falta?<\u002Flabel><\u002Fdiv>\n        <textarea rows=\"3\" id=\"reporte\" data-field=\"reporte\" placeholder=\"Si algo no coincidió con cómo te ves, contanos\"><\u002Ftextarea>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section>\n    <div class=\"rule\"><\u002Fdiv>\n    <div class=\"sec-k\">04 · IMPACTO<\u002Fdiv>\n    <h2>Qué te deja el recorrido<\u002Fh2>\n    <p class=\"sec-p\">La parte que más nos importa: qué cambió para vos y qué haríamos distinto.<\u002Fp>\n    <div class=\"stack\">\n\n      <div class=\"card\">\n        <div class=\"q\">Hoy tengo una idea más clara sobre mi futuro académico o profesional.<\u002Fdiv>\n        <div class=\"scale\" data-scale=\"ideaClara\"><\u002Fdiv>\n        <div class=\"ends\"><span>NADA CLARA<\u002Fspan><span>MUY CLARA<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"card\">\n        <div class=\"q\">¿Le recomendarías Mento.IA a otros estudiantes?<\u002Fdiv>\n        <div class=\"choices\" data-choice=\"recomendaria\"><\u002Fdiv>\n        <div class=\"more\" id=\"more-recomendaria\" hidden=\"\">\n          <label class=\"f\" for=\"recoPorque\">¿Por qué no? Decinos sin filtro.<\u002Flabel>\n          <textarea rows=\"3\" id=\"recoPorque\" data-field=\"recoPorque\" placeholder=\"Nos sirve más tu crítica que un elogio\"><\u002Ftextarea>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"card\">\n        <label class=\"q\" for=\"masGusto\" style=\"display:block;\">¿Qué fue lo que más te gustó de la plataforma?<\u002Flabel>\n        <textarea rows=\"2\" id=\"masGusto\" data-field=\"masGusto\" placeholder=\"Ese momento o esa parte que te quedó\"><\u002Ftextarea>\n      <\u002Fdiv>\n\n      <div class=\"card\">\n        <label class=\"q\" for=\"mejorarias\" style=\"display:block;\">¿Qué mejorarías?<\u002Flabel>\n        <textarea rows=\"5\" id=\"mejorarias\" data-field=\"mejorarias\" placeholder=\"Si pudieras cambiar una sola cosa, ¿cuál sería?\"><\u002Ftextarea>\n      <\u002Fdiv>\n\n      <div class=\"card\">\n        <label class=\"q\" for=\"funcionalidades\" style=\"display:block;\">¿Qué te gustaría que Mento.IA pudiera hacer en el futuro?<\u002Flabel>\n        <textarea rows=\"5\" id=\"funcionalidades\" data-field=\"funcionalidades\" placeholder=\"Imaginá sin límites: nos guía para lo que viene\"><\u002Ftextarea>\n      <\u002Fdiv>\n\n      <div class=\"card\">\n        <label class=\"q\" for=\"comentario\" style=\"display:block;\">¿Querés dejarnos algún comentario adicional?<\u002Flabel>\n        <textarea rows=\"5\" id=\"comentario\" data-field=\"comentario\" placeholder=\"Todo lo que no entró en las preguntas anteriores\"><\u002Ftextarea>\n      <\u002Fdiv>\n\n      <div class=\"card light\">\n        <div class=\"q\" style=\"margin-bottom:10px;\">¿Podemos citar alguna de tus respuestas en nuestras comunicaciones?<\u002Fdiv>\n        <p style=\"font-size:14px;line-height:1.8;color:var(--spa);margin:0 0 18px;text-wrap:pretty;\">Siempre sin tu nombre ni el de tu colegio. Si decís que no, tus respuestas quedan solo para uso interno.<\u002Fp>\n        <div class=\"choices\" data-choice=\"marketing\" data-labels=\"Sí, pueden usarlas|No, prefiero que no\"><\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <div style=\"padding-bottom:96px;\">\n    <div id=\"err\" role=\"alert\" aria-live=\"polite\" hidden=\"\"><\u002Fdiv>\n    <div class=\"send\"><button type=\"button\" id=\"submit\">Enviar mis respuestas<\u002Fbutton><\u002Fdiv>\n    <p class=\"note\">Todas las preguntas son obligatorias. Gracias por tomarte el tiempo.<\u002Fp>\n  <\u002Fdiv>\n\n<\u002Fdiv>\n\n<footer>\n  <div class=\"foot\">\n    <div style=\"display:flex;align-items:center;gap:10px;\">\n      <div class=\"mk\">M<\u002Fdiv>\n      <div><div class=\"w\">MENTO.IA<\u002Fdiv><div class=\"t\">Focused on your future.<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"links\"><a href=\"https://instagram.com/mypath.ia\">@MYPATH.IA<\u002Fa> · <a href=\"https://mentoia.com\">MENTOIA.COM<\u002Fa><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Ffooter>\n\n<div id=\"thanks\" hidden=\"\">\n  <div class=\"in\">\n    <div class=\"ring\">✓<\u002Fdiv>\n    <div class=\"eyebrow\">RESPUESTAS ENVIADAS<\u002Fdiv>\n    <h2>Gracias de verdad.<\u002Fh2>\n    <p id=\"thanks-copy\">Lo que escribiste ya está con nuestro equipo. Cada respuesta cambia algo de lo que viene, y tu sinceridad hace que Mento.IA sea mejor para quienes lo recorran después.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<script>\n(function () {\n  // Camino principal: la función /api/feedback (Vercel) reenvía a Slack y devuelve\n  // el estado real, así un webhook caído se ve como error de verdad.\n  // Respaldo: POST directo al webhook (form-urlencoded, sin preflight CORS) para\n  // cuando la página corre como archivo estático sin la función. En ese caso no se\n  // puede confirmar la entrega, así que el borrador NO se borra.\n  var ENDPOINT = \"/api/feedback\";\n  var WEBHOOK = \"https://hooks.slack.com/services/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\";\n  var DRAFT = \"mentoia_valoracion_borrador\";\n\n  var SCALES = [\"facilidad\",\"claridadAntes\",\"claridadDespues\",\"utilidad\",\"actividades\",\"fortalezas\",\"ideaClara\"];\n  var TEXTS = [\"colegio\",\"pais\",\"anio\",\"division\",\"curso\",\"videos\",\"preguntas\",\"reporte\",\"masGusto\",\"mejorarias\",\"funcionalidades\",\"comentario\"];\n  var CHOICES = [\"problemas\",\"recomendaria\",\"marketing\"];\n  var NAMES = {\n    colegio:\"Colegio\", pais:\"País\", anio:\"Año\", division:\"División\", curso:\"Curso u orientación\",\n    facilidad:\"Facilidad de uso\", facilidadDetalle:\"Qué te resultó difícil\",\n    problemas:\"Problemas técnicos\", problemasCuales:\"Cuáles fueron los problemas\",\n    claridadAntes:\"Claridad antes\", claridadDespues:\"Claridad después\",\n    utilidad:\"Información útil\", actividades:\"Las actividades\", fortalezas:\"Tus fortalezas\",\n    videos:\"Los videos\", preguntas:\"Las preguntas\", reporte:\"El reporte\",\n    ideaClara:\"Idea clara del futuro\", recomendaria:\"Si lo recomendarías\", recoPorque:\"Por qué no lo recomendarías\",\n    masGusto:\"Lo que más te gustó\", mejorarias:\"Qué mejorarías\", funcionalidades:\"Funcionalidades futuras\",\n    comentario:\"Comentario adicional\", marketing:\"Permiso para citar tus respuestas\"\n  };\n\n  var SLACK_LABELS = {\n    colegio:\"Colegio\", pais:\"País\", anio:\"Año\", division:\"División\", curso:\"Curso\",\n    facilidad:\"Facilidad de uso (1-10)\", facilidadDetalle:\"· Qué le costó\",\n    problemas:\"Problemas técnicos\", problemasCuales:\"· Cuáles\",\n    claridadAntes:\"Claridad ANTES (1-10)\", claridadDespues:\"Claridad DESPUÉS (1-10)\",\n    utilidad:\"Info de carreras útil (1-10)\", actividades:\"Actividades / intereses (1-10)\",\n    fortalezas:\"Conoce sus fortalezas (1-10)\", videos:\"Videos\", preguntas:\"Preguntas y respuestas\",\n    reporte:\"Reporte final\", ideaClara:\"Idea clara del futuro (1-10)\",\n    recomendaria:\"¿Recomendaría?\", recoPorque:\"· Por qué no\",\n    masGusto:\"Lo que más le gustó\", mejorarias:\"Qué mejoraría\",\n    funcionalidades:\"Funcionalidades futuras\", comentario:\"Comentario adicional\",\n    marketing:\"Autoriza uso en marketing\"\n  };\n\n  function slackPayload(a) {\n    var delta = (Number(a.claridadDespues) || 0) - (Number(a.claridadAntes) || 0);\n    var head = [\n      \"*Nueva valoración de Mento.IA*\",\n      [a.colegio, a.pais].filter(Boolean).join(\" · \"),\n      [a.anio, a.division, a.curso].filter(Boolean).join(\" / \")\n    ].filter(Boolean).join(\"\\n\");\n    var lines = Object.keys(SLACK_LABELS)\n      .filter(function (k) { return a[k] !== undefined && a[k] !== null && String(a[k]).trim() !== \"\"; })\n      .map(function (k) { return \"*\" + SLACK_LABELS[k] + \":* \" + String(a[k]).replace(/\\n+/g, \" / \"); });\n    return {\n      text: \"Nueva valoración de Mento.IA\",\n      blocks: [\n        { type: \"section\", text: { type: \"mrkdwn\", text: head } },\n        { type: \"context\", elements: [{ type: \"mrkdwn\", text:\n            \"Claridad \" + (a.claridadAntes || \"–\") + \" → \" + (a.claridadDespues || \"–\") +\n            \" (\" + (delta >= 0 ? \"+\" : \"\") + delta + \")  ·  Recomienda: \" + (a.recomendaria || \"–\") +\n            \"  ·  Marketing: \" + (a.marketing || \"–\") }] },\n        { type: \"divider\" },\n        { type: \"section\", text: { type: \"mrkdwn\", text: lines.join(\"\\n\").slice(0, 2900) } }\n      ]\n    };\n  }\n\n  // Devuelve \"confirmed\" (Slack respondió OK vía relay) o \"unconfirmed\" (envío\n  // directo y opaco). Lanza si no hay forma de entregarlo.\n  async function send(answers) {\n    var payload = slackPayload(answers);\n    var relayed = false;\n    try {\n      var res = await fetch(ENDPOINT, {\n        method: \"POST\",\n        headers: { \"Content-Type\": \"application/json\" },\n        body: JSON.stringify({ payload: payload, submittedAt: new Date().toISOString(), answers: answers })\n      });\n      relayed = true;\n      if (res.ok) return \"confirmed\";\n      if (res.status !== 404 && res.status !== 405) throw new Error(\"relay \" + res.status);\n      relayed = false; // no hay función desplegada: probamos el envío directo\n    } catch (e) {\n      if (relayed) throw e;\n    }\n    var body = new URLSearchParams();\n    body.set(\"payload\", JSON.stringify(payload));\n    await fetch(WEBHOOK, { method: \"POST\", mode: \"no-cors\", body: body });\n    return \"unconfirmed\";\n  }\n\n  var f = {};\n  try { f = JSON.parse(localStorage.getItem(DRAFT) || \"{}\") || {}; } catch (e) { f = {}; }\n\n  function save() { try { localStorage.setItem(DRAFT, JSON.stringify(f)); } catch (e) {} }\n\n  /* --- build 1-10 scales --- */\n  SCALES.forEach(function (key) {\n    var box = document.querySelector('[data-scale=\"' + key + '\"]');\n    if (!box) return;\n    for (var i = 1; i <= 10; i++) {\n      var b = document.createElement(\"button\");\n      b.type = \"button\";\n      b.textContent = i;\n      b.setAttribute(\"aria-label\", \"Puntaje \" + i + \" de 10\");\n      b.setAttribute(\"aria-pressed\", \"false\");\n      b.dataset.val = i;\n      b.addEventListener(\"click\", function () {\n        f[key] = Number(this.dataset.val);\n        save(); paint();\n      });\n      box.appendChild(b);\n    }\n  });\n\n  /* --- build Sí / No choices --- */\n  CHOICES.forEach(function (key) {\n    var box = document.querySelector('[data-choice=\"' + key + '\"]');\n    if (!box) return;\n    var labels = (box.dataset.labels || \"Sí|No\").split(\"|\");\n    [\"Sí\", \"No\"].forEach(function (val, i) {\n      var b = document.createElement(\"button\");\n      b.type = \"button\";\n      b.textContent = labels[i];\n      b.setAttribute(\"aria-pressed\", \"false\");\n      b.dataset.val = val;\n      b.addEventListener(\"click\", function () {\n        f[key] = this.dataset.val;\n        save(); paint();\n      });\n      box.appendChild(b);\n    });\n  });\n\n  /* --- text inputs --- */\n  var fields = Array.prototype.slice.call(document.querySelectorAll(\"[data-field]\"));\n  fields.forEach(function (el) {\n    var key = el.dataset.field;\n    if (f[key]) el.value = f[key];\n    el.addEventListener(\"input\", function () { f[key] = el.value; save(); paint(); });\n    el.addEventListener(\"change\", function () { f[key] = el.value; save(); paint(); });\n  });\n\n  function required() {\n    var req = TEXTS.concat(SCALES, CHOICES);\n    if (f.facilidad && f.facilidad <= 5) req.push(\"facilidadDetalle\");\n    if (f.problemas === \"Sí\") req.push(\"problemasCuales\");\n    if (f.recomendaria === \"No\") req.push(\"recoPorque\");\n    return req;\n  }\n  function empty(k) {\n    var v = f[k];\n    return v === undefined || v === null || (typeof v === \"string\" && v.trim() === \"\");\n  }\n  function missing() { return required().filter(empty); }\n\n  var errBox = document.getElementById(\"err\");\n  var showingErrors = false;\n\n  function paint() {\n    document.querySelectorAll(\"[data-scale] button, [data-choice] button\").forEach(function (b) {\n      var key = b.parentNode.dataset.scale || b.parentNode.dataset.choice;\n      var on = String(f[key]) === b.dataset.val;\n      b.setAttribute(\"aria-pressed\", on ? \"true\" : \"false\");\n    });\n\n    document.getElementById(\"more-facilidad\").hidden = !(f.facilidad && f.facilidad <= 5);\n    document.getElementById(\"more-problemas\").hidden = f.problemas !== \"Sí\";\n    document.getElementById(\"more-recomendaria\").hidden = f.recomendaria !== \"No\";\n\n    var req = required(), miss = missing();\n    var pct = Math.round((req.length - miss.length) / req.length * 100);\n    document.getElementById(\"progress\").style.width = pct + \"%\";\n    document.getElementById(\"pct\").textContent = pct + \"%\";\n\n    if (showingErrors) {\n      fields.forEach(function (el) {\n        el.classList.toggle(\"invalid\", miss.indexOf(el.dataset.field) > -1);\n      });\n      if (!miss.length) { errBox.hidden = true; showingErrors = false; }\n    }\n  }\n\n  document.getElementById(\"submit\").addEventListener(\"click\", async function () {\n    var btn = this;\n    var miss = missing();\n    if (miss.length) {\n      showingErrors = true;\n      var names = miss.map(function (k) { return NAMES[k] || k; });\n      var shown = names.slice(0, 5).join(\", \") + (names.length > 5 ? \" y \" + (names.length - 5) + \" más\" : \"\");\n      errBox.textContent = (miss.length === 1 ? \"Falta 1 respuesta\" : \"Faltan \" + miss.length + \" respuestas\") + \" para poder enviar: \" + shown + \".\";\n      errBox.hidden = false;\n      paint();\n      window.scrollTo({ top: errBox.getBoundingClientRect().top + window.scrollY - 120, behavior: \"smooth\" });\n      return;\n    }\n    btn.disabled = true;\n    btn.textContent = \"Enviando…\";\n    errBox.hidden = true;\n    try {\n      var result = await send(f);\n      if (result === \"confirmed\") {\n        try { localStorage.removeItem(DRAFT); } catch (e) {}\n      } else {\n        // No pudimos verificar la entrega: dejamos el borrador y lo decimos.\n        document.getElementById(\"thanks-copy\").textContent =\n          \"Enviamos tus respuestas al equipo de Mento.IA. No podemos confirmar la entrega desde acá, así que dejamos una copia guardada en este navegador por si hay que reintentar.\";\n      }\n      document.getElementById(\"thanks\").hidden = false;\n    } catch (e) {\n      btn.disabled = false;\n      btn.textContent = \"Enviar mis respuestas\";\n      errBox.textContent = \"No pudimos enviar tus respuestas ahora mismo. Quedaron guardadas en este navegador: probá de nuevo en unos segundos.\";\n      errBox.hidden = false;\n    }\n  });\n\n  paint();\n})();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
